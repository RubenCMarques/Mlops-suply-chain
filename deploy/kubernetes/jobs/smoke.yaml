apiVersion: batch/v1
kind: Job
metadata:
  name: kedro-smoke
  namespace: supply-chain
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: pipeline
          image: supply-chain-backend:local
          imagePullPolicy: IfNotPresent
          command: [kedro, run, --pipelines, smoke]
          envFrom:
            - configMapRef:
                name: supply-chain-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
