apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: feature-snapshots
  namespace: supply-chain
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kedro-feature-snapshot
  namespace: supply-chain
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: pipeline
          image: supply-chain-backend:local
          imagePullPolicy: IfNotPresent
          command: [kedro, run, --pipelines, feature_snapshot]
          envFrom:
            - configMapRef:
                name: supply-chain-config
            - secretRef:
                name: hopsworks
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: feature-snapshots
