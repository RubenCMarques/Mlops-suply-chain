[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-backend"
version = "0.1.0"
description = "Supply chain API and machine learning workflows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "kedro>=1.7,<1.8",
    "kedro-datasets[pandas-parquetdataset]>=6,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<=0.28.1", "ruff>=0.15,<1"]
hopsworks = ["hopsworks[python]>=5.0.9,<5.1"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.kedro]
package_name = "supply_chain"
project_name = "Supply Chain"
kedro_init_version = "1.7.0"
source_dir = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
